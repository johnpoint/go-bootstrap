name: Copilot Code Review

on:
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'copilot-review')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get PR diff
        id: changes
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          DIFF=$(git diff origin/${{ github.base_ref }} HEAD)
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Post code review analysis
        uses: actions/github-script@v7
        if: steps.changes.outputs.has_changes == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Get PR files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Build file list
            let filesList = files
              .map(f => `- \`${f.filename}\` (${f.additions} additions, ${f.deletions} deletions)`)
              .join('\n');
            
            // Calculate totals
            const totalAdditions = files.reduce((s, f) => s + f.additions, 0);
            const totalDeletions = files.reduce((s, f) => s + f.deletions, 0);
            
            // Create review comment
            const reviewComment = `## 🤖 Copilot Code Review
            
This PR has been marked for code review with the \`copilot-review\` label.

### PR Statistics
- **Files changed:** ${files.length}
- **Total additions:** ${totalAdditions}
- **Total deletions:** ${totalDeletions}
- **Net change:** ${totalAdditions - totalDeletions}

### Changed Files
${filesList}

### Next Steps
To get a detailed AI-powered code review:
1. Use GitHub Copilot in your IDE to review individual files
2. Check the PR diff view for line-by-line suggestions
3. Run \`copilot review\` locally on this branch for detailed analysis`;

            // Post the comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewComment
            });
            
            console.log('Code review analysis posted');
