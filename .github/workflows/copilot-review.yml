name: Copilot Code Review

on:
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'copilot-review')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review Code
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            let filesList = '';
            let totalAdditions = 0;
            let totalDeletions = 0;

            for (const file of files.data) {
              totalAdditions += file.additions;
              totalDeletions += file.deletions;
              filesList += `- \`${file.filename}\` (+${file.additions}/-${file.deletions})\n`;
            }

            const body = `## 🤖 Copilot Code Review

This PR has been marked for code review with the \`copilot-review\` label.

### Changes Summary
- **Files changed:** ${files.data.length}
- **Lines added:** ${totalAdditions}
- **Lines deleted:** ${totalDeletions}

### Modified Files
${filesList}

### Recommendations
Review the changes using:
- GitHub Copilot inline suggestions
- The PR diff view for detailed changes
- \`copilot review\` command locally`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
