name: Copilot Code Review

on:
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'copilot-review')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get PR changes
        id: changes
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          DIFF=$(git diff origin/${{ github.base_ref }} HEAD)
          echo "has_changes=true" >> $GITHUB_OUTPUT
          # Save diff to file for review
          echo "$DIFF" > /tmp/pr_changes.diff

      - name: Request Copilot review
        uses: actions/github-script@v7
        with:
          script: |
            // Get PR diff info
            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Get diff stats
            let filesList = files.data.map(f => {
              return `- ${f.filename} (${f.additions} additions, ${f.deletions} deletions)`;
            }).join('\n');
            
            // Create review request comment
            const reviewComment = `## 🤖 Copilot Code Review Triggered

This PR has been marked for Copilot review with the \`copilot-review\` label.

**PR Summary:**
- Files changed: ${files.data.length}
- Total additions: ${files.data.reduce((s, f) => s + f.additions, 0)}
- Total deletions: ${files.data.reduce((s, f) => s + f.deletions, 0)}

**Changed Files:**
${filesList}

**Review Status:** Awaiting detailed review analysis...

To perform a detailed code review with Copilot, you can:
1. Run \`copilot review\` locally on the branch
2. Use GitHub Copilot's built-in code review features
3. Review individual files through the PR interface`;
            
            // Post the comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewComment
            });
            
            console.log('Code review analysis posted to PR');
