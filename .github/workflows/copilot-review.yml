name: Copilot Code Review

on:
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'copilot-review')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post code review analysis
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            let filesOutput = '';
            let additions = 0;
            let deletions = 0;

            for (const file of files.data) {
              additions += file.additions;
              deletions += file.deletions;
              filesOutput = filesOutput + '- `' + file.filename + '` (+' + file.additions + '/-' + file.deletions + ')\n';
            }

            const comment = '## 🤖 Copilot Code Review\n\n' +
              'This PR has been marked for code review with the `copilot-review` label.\n\n' +
              '### Changes Summary\n' +
              '- **Files changed:** ' + files.data.length + '\n' +
              '- **Lines added:** ' + additions + '\n' +
              '- **Lines deleted:** ' + deletions + '\n\n' +
              '### Modified Files\n' +
              filesOutput + '\n' +
              '### Recommendations\n' +
              'Review the changes using:\n' +
              '- GitHub Copilot inline suggestions\n' +
              '- The PR diff view for detailed changes\n' +
              '- `copilot review` command locally';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
