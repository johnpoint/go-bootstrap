name: Copilot Code Review

on:
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'copilot-review')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get PR diff
        id: pr_diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }} > /tmp/pr.diff
          echo "Success: PR diff generated"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot-cli

      - name: Run Copilot review
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if diff file exists and has content
          if [ -s /tmp/pr.diff ]; then
            echo "Running Copilot review on PR changes..."
            # Run copilot review and capture output
            copilot review /tmp/pr.diff > /tmp/review.txt 2>&1 || echo "Review completed with status: $?"
            REVIEW_OUTPUT=$(cat /tmp/review.txt)
            echo "review_output<<REVIEW_EOF" >> $GITHUB_OUTPUT
            echo "$REVIEW_OUTPUT" >> $GITHUB_OUTPUT
            echo "REVIEW_EOF" >> $GITHUB_OUTPUT
          else
            echo "No changes found in PR"
            echo "review_output=No changes to review" >> $GITHUB_OUTPUT
          fi

      - name: Post review comment
        uses: actions/github-script@v7
        if: steps.review.outputs.review_output != ''
        with:
          script: |
            const review = `${{ steps.review.outputs.review_output }}`;
            if (review && review.trim().length > 0) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🤖 Copilot Code Review\n\n${review}`
              });
            }
