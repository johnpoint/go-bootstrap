name: Copilot Code Review

on:
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'copilot-review')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD | head -c 15000 > /tmp/pr.diff
          echo "Diff size: $(wc -c < /tmp/pr.diff) bytes"
          cat /tmp/pr.diff

      - name: Generate AI code review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'NODESCRIPT'
          const fs = require('fs');
          const https = require('https');

          const diff = fs.readFileSync('/tmp/pr.diff', 'utf8');

          if (!diff.trim()) {
            fs.writeFileSync('/tmp/review.txt', 'No code changes found to review.');
            process.exit(0);
          }

          const systemPrompt =
            'You are a senior software engineer conducting a thorough code review. ' +
            'Analyze the provided PR diff and give actionable feedback. ' +
            'Structure your review with these sections:\n' +
            '## Summary\nBrief overview of the changes.\n\n' +
            '## Issues\nList any bugs, security vulnerabilities, or logic errors.\n\n' +
            '## Suggestions\nCode quality, performance, and maintainability improvements.\n\n' +
            '## Positives\nWell-written parts worth highlighting.\n\n' +
            'Be specific, cite line numbers when relevant, and use markdown.';

          const payload = JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: 'Please review the following PR diff:\n\n```diff\n' + diff + '\n```' }
            ],
            max_tokens: 2048,
            temperature: 0.3
          });

          const options = {
            hostname: 'models.inference.ai.azure.com',
            path: '/chat/completions',
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN,
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(payload)
            }
          };

          const req = https.request(options, (res) => {
            let data = '';
            res.on('data', chunk => { data += chunk; });
            res.on('end', () => {
              try {
                const response = JSON.parse(data);
                if (response.choices && response.choices[0]) {
                  fs.writeFileSync('/tmp/review.txt', response.choices[0].message.content);
                  console.log('Review generated successfully');
                } else {
                  console.error('Unexpected API response:', data);
                  fs.writeFileSync('/tmp/review.txt', 'API Error: ' + JSON.stringify(response));
                  process.exit(1);
                }
              } catch (e) {
                console.error('Failed to parse response:', e.message);
                fs.writeFileSync('/tmp/review.txt', 'Parse error: ' + data.substring(0, 500));
                process.exit(1);
              }
            });
          });

          req.on('error', (e) => {
            console.error('Request error:', e.message);
            fs.writeFileSync('/tmp/review.txt', 'Request failed: ' + e.message);
            process.exit(1);
          });

          req.write(payload);
          req.end();
          NODESCRIPT

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let review = 'Code review could not be generated. Please check workflow logs.';

            try {
              review = fs.readFileSync('/tmp/review.txt', 'utf8');
            } catch (e) {
              core.warning('Could not read review file: ' + e.message);
            }

            const body =
              '## 🤖 AI Code Review\n\n' +
              review +
              '\n\n---\n*Powered by [GitHub Models](https://github.com/marketplace/models) · gpt-4o-mini*';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
